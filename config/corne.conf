# Enable Bluetooth
CONFIG_ZMK_BLE=y

# Deep Sleep (e.g., 15 minutes) to save battery
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth profiles
CONFIG_BT_MAX_CONN=5

# Boost Bluetooth transmit power for stable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery Monitoring (if using a lithium battery)
CONFIG_ZMK_BATTERY_SENSOR_VBUS_FALLBACK=y

# Completely disable display support
CONFIG_ZMK_DISPLAY=n
