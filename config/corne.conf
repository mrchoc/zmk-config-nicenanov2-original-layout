CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Deep sleep / power ----------------------------------------------------
# Enable idle deep sleep to save battery.
CONFIG_ZMK_SLEEP=y
# Go to deep sleep after 30 minutes of inactivity (value in ms).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Dim/idle the display & turn off external power after 5 min (ms).
CONFIG_ZMK_IDLE_TIMEOUT=300000

# --- Battery reporting -----------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
# Report the peripheral (right) half's battery level to the host too.
# Both are required.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
